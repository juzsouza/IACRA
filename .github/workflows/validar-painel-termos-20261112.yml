name: IACRA - painel dos termos CI

on:
  push:
    branches: [iacra-acompanhamento-termos-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/enrollment_tracking.test.ts
      - run: npx tsx src/tests/enrollment_share_group_test.ts
      - run: npx tsx src/tests/instrument_and_room_schedule.test.ts
      - run: npm run test:billings
      - run: npm run build
