name: Testar credito Hostware no login sem deploy
on:
  push:
    branches: [iacra-restaurar-credito-hostware-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx src/tests/hostware_footer_login.test.ts
      - run: npx tsx src/tests/login_sem_recuperacao_email.test.ts
      - run: npx tsx src/tests/payment_actions_responsive.test.ts
      - run: npx tsx src/tests/choir_monthly_finance.test.ts
      - run: npm run lint
      - run: npm run build
