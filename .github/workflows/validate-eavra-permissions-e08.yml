name: Validar EAVRA-08 em PostgreSQL descartavel
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter branch de desenvolvimento
        uses: actions/checkout@v4
      - name: Subir PostgreSQL 17 descartavel
        shell: bash
        run: |
          docker run -d --name eavra-e08-pg -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=eavra_e08_test postgres:17
          for i in $(seq 1 45); do
            if docker exec eavra-e08-pg pg_isready -U postgres -d eavra_e08_test; then exit 0; fi
            sleep 2
          done
          docker logs eavra-e08-pg
          exit 1
      - name: Criar apenas estruturas ficticias de autenticacao
        shell: bash
        run: |
          docker exec -i eavra-e08-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e08_test <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          GRANT USAGE ON SCHEMA auth TO anon,authenticated,service_role;
          CREATE TABLE auth.users(id uuid PRIMARY KEY,email text,banned_until timestamptz);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $fn$
            SELECT NULLIF(current_setting('request.jwt.claim.sub',true),'')::uuid;
          $fn$;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon,authenticated,service_role;
          SQL
      - name: Validar base v9 no banco descartavel
        run: docker exec -i eavra-e08-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e08_test < supabase/schema-dev-v9-review.sql
      - name: Aplicar modelo de permissoes somente no banco descartavel
        run: |
          docker exec -i eavra-e08-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e08_test < review/eavra-e08/08_private_permissions.sql.txt
          docker exec -i eavra-e08-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e08_test < review/eavra-e08/08_coral_policy_example.sql.txt
      - name: Testar papeis, privilegios e RLS
        run: docker exec -i eavra-e08-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e08_test < review/eavra-e08/08_permission_pg_checks.sql.txt
      - name: Descartar banco
        if: always()
        run: docker rm -f eavra-e08-pg || true
