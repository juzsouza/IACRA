name: IACRA - preview WhatsApp e grupos no termo

on:
  push:
    branches: [iacra-preview-termo-whatsapp-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx src/tests/enrollment_share_group_test.ts
      - run: npx tsx src/tests/instrument_and_room_schedule.test.ts
      - run: npx tsx src/tests/rich_term_editor.test.ts
      - run: npm run test:billings
      - run: npm run build
