name: IACRA - duas migracoes juntas em banco temporario

on:
  push:
    branches:
      - iacra-prod-preparacao-segura-20261109
      - iacra-validacao-seguranca-20261110
    paths:
      - 'docs/revisao-producao/**'
      - '.github/workflows/validar-duas-migracoes-iacra-isoladas.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/revisao-producao/**'
      - '.github/workflows/validar-duas-migracoes-iacra-isoladas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrado:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: apenas-dados-ficticios
          POSTGRES_DB: iacra_integrado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iacra_integrado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: iacra_integrado
      PGUSER: postgres
      PGPASSWORD: apenas-dados-ficticios
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar cliente
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Criar esquema compativel com PROD usando dados ficticios
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/testes/esquema_compativel_prod_sem_dados.sql
      - name: Criar perfis administrativos ficticios
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/testes/permissoes_preenchimento_ficticio_integrado.sql
      - name: Testar instalacao conjunta matricula e salas
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/RASCUNHO_migracao_termos_salas_20261106.sql
      - name: Testar instalacao conjunta catalogo e RPCs de permissoes
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/RASCUNHO_permissoes_painel_prod_20261109.sql
      - name: Testar convite, aluno existente e salas
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/testes/verificacoes.sql
      - name: Testar isencao, menor e dados financeiros preservados
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/testes/verificacoes_esquema_prod.sql
      - name: Testar perfil Super Admin, professores e auditoria
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/testes/permissoes_validacao_integrada_prod.sql
      - name: Bloquear tentativa de escalar perfil Super Admin nas telas novas
        run: psql -X -v ON_ERROR_STOP=1 -f docs/revisao-producao/testes/validar_allowlist_matricula_salas.sql
      - name: Conferir registros financeiros ficticios
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN (SELECT count(*) FROM public.transactions)=1 AND (SELECT count(*) FROM public.competence_billings)=1 AND (SELECT count(*) FROM app_private.eavra_dev_rooms)=7 AND (SELECT count(*) FROM app_private.eavra_permission_catalog)=52 THEN 'OK' ELSE 'FALHA' END" | grep -qx OK
