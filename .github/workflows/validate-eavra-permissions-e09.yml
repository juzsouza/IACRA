name: Validar EAVRA-09 RPC e auditoria em PostgreSQL descartavel
on:
  push:
    branches:
      - bolt-migration-test
    paths:
      - '.github/workflows/validate-eavra-permissions-e09.yml'
      - 'review/eavra-e09/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-write-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch de testes
        uses: actions/checkout@v4

      - name: Criar PostgreSQL isolado
        run: |
          docker run -d --name eavra-e09-pg \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=eavra_e09_test postgres:17
          for i in $(seq 1 45); do
            if docker exec eavra-e09-pg pg_isready -U postgres -d eavra_e09_test; then exit 0; fi
            sleep 2
          done
          docker logs eavra-e09-pg
          exit 1

      - name: Preparar Auth de teste sem credenciais reais
        run: |
          docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d eavra_e09_test <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          GRANT USAGE ON SCHEMA auth TO anon,authenticated,service_role;
          CREATE TABLE auth.users(id uuid PRIMARY KEY,email text,banned_until timestamptz);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $fn$
            SELECT NULLIF(current_setting('request.jwt.claim.sub',true),'')::uuid;
          $fn$;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon,authenticated,service_role;
          SQL

      - name: Instalar base v9 SOMENTE no banco temporario
        run: docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e09_test < supabase/schema-dev-v9-review.sql

      - name: Preparar permissao privada e RLS do Coral de teste
        run: |
          docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e09_test < review/eavra-e08/08_private_permissions.sql.txt
          docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e09_test < review/eavra-e08/08_coral_policy_example.sql.txt

      - name: Executar testes previamente aprovados na etapa 08
        run: docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e09_test < review/eavra-e08/08_permission_pg_checks.sql.txt

      - name: Instalar RPCs SOMENTE no banco temporario
        run: docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e09_test < review/eavra-e09/09_permission_rpc.sql.txt

      - name: Validar leitura, gravacao, auditoria e protecao
        run: docker exec -i eavra-e09-pg psql -X -v ON_ERROR_STOP=1 -U postgres -d eavra_e09_test < review/eavra-e09/09_permission_rpc_checks.sql.txt

      - name: Descartar PostgreSQL
        if: always()
        run: docker rm -f eavra-e09-pg || true
